# ErnsAuth API vhost -- sso.erns.eu -- server-to-server calls from your
# apps (ErnsAuthClient). NO client certificate here: it is protected by the
# per-app X-API-Key, ErnsAuth's rate limits, and the IP allowlist below.
#
# Serves ONLY sso-api.php from the shared DocumentRoot; every other file
# (dashboard, login, api.php, setup.php, css, js) is refused on this host.
#
# Required modules: a2enmod ssl headers rewrite alias authz_core authz_host
# Install:
#   sudo cp ernsauth-api.conf /etc/apache2/sites-available/
#   sudo a2ensite ernsauth-api && sudo apachectl configtest && sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName sso.erns.eu
    DocumentRoot /var/www/letsencrypt
    <Directory /var/www/letsencrypt>
        Require all granted
        Options -Indexes
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://sso.erns.eu%{REQUEST_URI} [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/sso.erns.eu-error.log
    CustomLog ${APACHE_LOG_DIR}/sso.erns.eu-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName sso.erns.eu

    # >>> EDIT: the SAME path as the dashboard vhost <<<
    DocumentRoot /path/to/ernsauth/web

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/sso.erns.eu/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/sso.erns.eu/privkey.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLVerifyClient none

    <Directory /path/to/ernsauth/web>
        AllowOverride All
        Options -Indexes -MultiViews -ExecCGI
        # Default-deny the whole tree; only the one file below is opened.
        Require all denied

        <LimitExcept GET POST HEAD>
            Require all denied
        </LimitExcept>
    </Directory>

    # >>> EDIT: the public IPs of the servers that run your apps <<<
    # (127.0.0.1/::1 let the local health check reach it.) When an app
    # with a changing IP joins, either give that app a VPN address listed
    # here, or put it behind a client certificate on its own hostname --
    # see docs/MTLS.md.
    <Files "sso-api.php">
        Require ip 127.0.0.1 ::1 203.0.113.10
    </Files>

    TraceEnable Off
    ServerSignature Off

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Strict-Transport-Security "max-age=31536000"

    ErrorLog ${APACHE_LOG_DIR}/sso.erns.eu-error.log
    CustomLog ${APACHE_LOG_DIR}/sso.erns.eu-access.log combined
</VirtualHost>
