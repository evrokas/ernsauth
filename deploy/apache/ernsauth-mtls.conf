# The ONE place the client-certificate requirement lives. Included from the
# dashboard vhost and the catch-all vhost (never the API vhost).
#
# Install:  sudo cp ernsauth-mtls.conf /etc/apache2/ernsauth-mtls.conf
#
# The CA certificate and CRL come from your own computer -- see
# docs/MTLS.md and deploy/mtls/server-install-crl.sh. Apache reads the CRL
# only at (re)load, so a revocation takes effect after a reload.

SSLCACertificateFile  /etc/ssl/ernsauth-ca/ca.crt
SSLVerifyClient       require
SSLVerifyDepth        1
SSLCARevocationFile   /etc/ssl/ernsauth-ca/crl.pem
SSLCARevocationCheck  chain

# ── EMERGENCY SWITCH (locked out? e.g. expired CRL, lost every device) ─────
# Do this ONLY over SSH, and put it back afterwards:
#   1. change "SSLVerifyClient require" above to "SSLVerifyClient none"
#   2. comment out the SSLCARevocation* lines if the CRL is the problem
#   3. sudo apachectl configtest && sudo systemctl reload apache2
# With that on, the dashboard is protected by its password + number
# matching only. The health check (deploy/health-handler.php) warns while
# the requirement is off, so it can't be forgotten.
