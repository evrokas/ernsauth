# ErnsAuth DASHBOARD vhost -- auth.erns.eu -- the human approval screens.
# Requires a client certificate (deploy/apache/ernsauth-mtls.conf).
#
# Same DocumentRoot as the API vhost, on purpose: the split is by hostname.
# This vhost refuses sso-api.php; ernsauth-api.conf serves ONLY that file.
#
# Required modules: a2enmod ssl headers rewrite alias authz_core
# Install:
#   sudo cp ernsauth-dashboard.conf /etc/apache2/sites-available/
#   sudo a2ensite ernsauth-dashboard && sudo apachectl configtest && sudo systemctl reload apache2
# Replace the old HTTP-only config/apache.config site (and any certbot-made
# "-le-ssl" copy of it) -- two vhosts for one name will fight.

# Port 80 serves nothing but Let's Encrypt validation and a redirect.
# The ACME path must NOT be redirected: validation would follow it to :443
# and fail the client-certificate handshake, and renewal would silently
# stop working.
<VirtualHost *:80>
    ServerName auth.erns.eu
    DocumentRoot /var/www/letsencrypt
    <Directory /var/www/letsencrypt>
        Require all granted
        Options -Indexes
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://auth.erns.eu%{REQUEST_URI} [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/auth.erns.eu-error.log
    CustomLog ${APACHE_LOG_DIR}/auth.erns.eu-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName auth.erns.eu

    # >>> EDIT: set this to ernsauth's actual path on this server <<<
    DocumentRoot /path/to/ernsauth/web

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/auth.erns.eu/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/auth.erns.eu/privkey.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    # Enforced at vhost level only. Per-directory client-certificate
    # requirements force a TLS renegotiation mid-connection, which is
    # unreliable with TLS 1.3 and in browsers.
    Include /etc/apache2/ernsauth-mtls.conf
    SSLOptions +StdEnvVars

    <Directory /path/to/ernsauth/web>
        AllowOverride All
        Require all granted
        Options -Indexes -MultiViews -ExecCGI

        <LimitExcept GET POST HEAD>
            Require all denied
        </LimitExcept>
    </Directory>

    # The API lives on its own hostname (sso.erns.eu).
    <Files "sso-api.php">
        Require all denied
    </Files>

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    <FilesMatch "\.(log|sql|sqlite|json|md|php~)$">
        Require all denied
    </FilesMatch>

    TraceEnable Off
    ServerSignature Off

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Strict-Transport-Security "max-age=31536000"

    ErrorLog ${APACHE_LOG_DIR}/auth.erns.eu-error.log
    CustomLog ${APACHE_LOG_DIR}/auth.erns.eu-access.log combined
</VirtualHost>
