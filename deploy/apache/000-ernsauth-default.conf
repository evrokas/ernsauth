# OPTIONAL catch-all: what answers when someone connects by bare IP, or
# with a hostname no vhost claims. Without it, Apache hands those requests
# to the FIRST vhost it loaded -- which could be a site that doesn't require
# a certificate. Here they get a client-certificate handshake and, with one,
# an empty denied directory.
#
# !! Only install this if ErnsAuth has this Apache to itself, or EVERY other
# !! site on it has its own named vhost. Otherwise it will swallow requests
# !! meant for sites relying on being the default.
#
# The name starts with 000- so it loads first and becomes the default.
# Debian/Ubuntu ship the "snakeoil" certificate used here (package
# ssl-cert); it is only ever shown to scanners.
#
#   sudo mkdir -p /var/www/ernsauth-empty
#   sudo cp 000-ernsauth-default.conf /etc/apache2/sites-available/
#   sudo a2ensite 000-ernsauth-default

<VirtualHost _default_:443>
    ServerName default.invalid
    DocumentRoot /var/www/ernsauth-empty

    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/ssl-cert-snakeoil.pem
    SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    Include /etc/apache2/ernsauth-mtls.conf

    <Directory /var/www/ernsauth-empty>
        Require all denied
    </Directory>
</VirtualHost>

<VirtualHost _default_:80>
    ServerName default.invalid
    DocumentRoot /var/www/ernsauth-empty
    <Directory /var/www/ernsauth-empty>
        Require all denied
    </Directory>
</VirtualHost>
